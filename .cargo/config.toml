# Build setup for Windows machines without Visual Studio build tools.
#
# The `x86_64-pc-windows-gnu` target needs no MSVC, but cargo still searches PATH
# for `link.exe` when it compiles proc-macro crates, and the GNU binutils shipped
# with this repo's shell provide a BusyBox `link.exe` that shadows the real
# linker. That is the whole cause of the "link.exe failed" errors on such a
# machine: the target is fine, the name resolves to the wrong program.
#
# Removing this file is safe. On a machine with MSVC build tools, delete it and
# `cargo build` uses the default MSVC toolchain.

[build]
target = "x86_64-pc-windows-gnu"
