[workspace]
members = [
  "apps/alpinoxi_client",
  "packages/alpinoxi_auth_system",
  "packages/alpinoxi_core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["AlpinoxiGD"]
license = "MIT"
repository = "https://github.com/alpstudios346/alpinoxi-client"
homepage = "https://github.com/alpstudios346/alpinoxi-client"

[workspace.dependencies]
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
