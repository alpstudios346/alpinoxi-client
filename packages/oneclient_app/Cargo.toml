[package]
name = "oneclient_app"
description = "AlpinoxiClient launcher"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[[bin]]
name = "alpinoxi_client"
path = "src/main.rs"

[features]
default = []

[dependencies]
tokio-util.workspace = true
oneclient_auth.workspace = true
oneclient_cluster.workspace = true
oneclient_common.workspace = true
oneclient_content.workspace = true
oneclient_events.workspace = true
oneclient_java.workspace = true
oneclient_mc.workspace = true
oneclient_polyplus.workspace = true
oneclient_net.workspace = true
oneclient_core.workspace = true
oneclient_db.workspace = true
chrono.workspace = true
oneclient_macro = { workspace = true, features = ["freya"] }

accesskit.workspace = true
polyio.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
tokio.workspace = true
uuid.workspace = true
bytes.workspace = true
sys-locale.workspace = true
sysinfo.workspace = true
inventory.workspace = true

notify.workspace = true

anyhow.workspace = true
regex.workspace = true
directories.workspace = true
dunce.workspace = true
percent-encoding.workspace = true

# rfd = "=0.17.2"
# open = "=5.4.0"
rfd.workspace = true
open.workspace = true
url.workspace = true

# clipboard image copy + decode for it
arboard.workspace = true
image.workspace = true

freya-skia-safe.workspace = true
plusrenderer.workspace = true
freya.workspace = true
freya-core.workspace = true
pulldown-cmark.workspace = true
base64.workspace = true

[dev-dependencies]
freya-testing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = "=0.1.52"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
freya-winit.workspace = true
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[package.metadata.packager]
product-name = "AlpinoxiClient"
identifier = "com.alpinoxi.client"
category = "Game"
publisher = "Alpinoxi"
authors = ["Alpinoxi contributors"]
copyright = "© 2026 Alpinoxi contributors; see ATTRIBUTION.md for upstream credits."
long-description = "AlpinoxiClient is an open-source Minecraft launcher."
license-file = "../../LICENSE"
formats = ["nsis", "app", "dmg", "deb", "appimage"]
binaries = [{ path = "alpinoxi_client", main = true }]
icons = [
  "icons/32x32.png",
  "icons/64x64.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/512x512.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
resources = [
  { src = "icons/generated/Assets.car", target = "Assets.car" },
  { src = "../../LICENSE", target = "LICENSE" },
  { src = "../../ATTRIBUTION.md", target = "ATTRIBUTION.md" },
  { src = "../../FORK_CHANGELOG.md", target = "FORK_CHANGELOG.md" },
  # >>> CRT_RESOURCES >>>
  # <<< CRT_RESOURCES <<<
]

[package.metadata.packager.macos]
minimum-system-version = "10.14"
entitlements = "distribution/App.entitlements"
info-plist-path = "distribution/Info.plist"

[package.metadata.packager.dmg]
background = "distribution/dmg-background.tiff"
window-size = { width = 600, height = 400 }
app-position = { x = 160, y = 190 }
application-folder-position = { x = 440, y = 190 }

[package.metadata.packager.windows]
digest-algorithm = "sha256"
timestamp-url = "https://timestamp.digicert.com"

[package.metadata.packager.nsis]
preinstall-section = """
; >>> VC_REDIST_SECTION >>>
Section "-VCRedist"
  SetRegView 64
  ReadRegDWORD $R0 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Installed"
  ReadRegDWORD $R1 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Minor"
  SetRegView lastused

  ${If} $R0 == 1
  ${AndIf} $R1 >= 40
    Goto vcredist_done
  ${EndIf}

  ${If} $PassiveMode != 1
    MessageBox MB_OK|MB_ICONEXCLAMATION "This build of AlpinoxiClient needs the Microsoft Visual C++ Redistributable (x64) 14.40 or newer. Install it from https://aka.ms/vs/17/release/vc_redist.x64.exe, then run this installer again."
  ${EndIf}

  vcredist_done:
SectionEnd
; <<< VC_REDIST_SECTION <<<
"""

[package.metadata.packager.deb]
desktop-template = "distribution/linux/com.alpinoxi.client.template"

[package.metadata.packager.appimage]
# desktop entry generated from the deb template above via the linux config
excluded-libraries = ["libwayland-*"]

[package.metadata.generate-rpm]
name = "alpinoxi-client"
auto-req = "builtin"
assets = [
  { source = "../../LICENSE", dest = "/usr/share/licenses/alpinoxi-client/LICENSE", mode = "644" },
  { source = "../../ATTRIBUTION.md", dest = "/usr/share/doc/alpinoxi-client/ATTRIBUTION.md", mode = "644", doc = true },
  { source = "../../FORK_CHANGELOG.md", dest = "/usr/share/doc/alpinoxi-client/FORK_CHANGELOG.md", mode = "644", doc = true },
  { source = "target/release/alpinoxi_client", dest = "/usr/bin/alpinoxi_client", mode = "755" },
  { source = "target/release/alpinoxi_client.desktop", dest = "/usr/share/applications/alpinoxi_client.desktop", mode = "644" },
  { source = "icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/alpinoxi_client.png", mode = "644" },
  { source = "icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/alpinoxi_client.png", mode = "644" },
  { source = "icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/alpinoxi_client.png", mode = "644" },
  { source = "icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/alpinoxi_client.png", mode = "644" },
]

