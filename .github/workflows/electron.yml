name: Electron (Windows installer)

# Builds the Electron launcher: an NSIS installer and a portable exe, both
# with Chromium bundled, so the window looks the same on every machine.

on:
  push:
    branches: [main]
    paths:
      - 'apps/alpinoxi-electron/**'
      - 'ui/**'
      - '.github/workflows/electron.yml'
  workflow_dispatch:

jobs:
  package:
    name: Package (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/alpinoxi-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The page is shared with the webview build, so it is generated first.
      - name: Build the interface page
        working-directory: .
        run: python ui/build_ui.py --check

      - name: Copy the page into the Electron app
        shell: bash
        run: |
          cp ../../ui/dist/alpinoxi-ui.html ui/index.html
          python - <<'PY'
          import io, pathlib
          page = pathlib.Path('ui/index.html')
          text = page.read_text(encoding='utf-8')
          shim = '''<script>
          window.alpinoxi = {
            send(command) {
              if (window.alpinoxiIpc) return window.alpinoxiIpc.send(command);
              return Promise.resolve(null);
            }
          };
          </script>
          '''
          text = text.replace('<script>\n"use strict";', shim + '<script>\n"use strict";', 1)
          page.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Self-test the command layer
        run: npx electron main.js --self-test

      - name: Package
        run: npm run build:win

      - name: Collect
        shell: bash
        run: ls -la ../../dist/electron

      - uses: actions/upload-artifact@v4
        with:
          name: AlpinoxiClient-electron
          path: dist/electron/*
          if-no-files-found: error
